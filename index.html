<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4430">
<title>Macroeconomics Study Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/lab.css">
<style>
  body{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
  .hub{padding-top:28px}
  .lec{display:flex; gap:14px; align-items:center; background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:14px 16px; text-decoration:none; color:var(--ink); min-height:72px}
  a.lec:hover{border-color:var(--note)}
  .lec .num{flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font:700 18px var(--serif); background:var(--note); color:var(--paper)}
  .lec.soon{border-style:dashed}
  .lec.soon .num{background:var(--paper); color:var(--muted); border:2px solid var(--border)}
  .lec b{display:block; font:700 17px/1.3 var(--serif)}
  .lec small{display:block; color:var(--muted); font-size:14px}
  .lec .go{margin-left:auto; flex:none; font:600 14px var(--sans); color:var(--note)}
  .lecs{display:grid; gap:10px; margin:16px 0}
  @media (min-width:900px){ .wrap{max-width:860px} .lecs{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<main class="wrap hub">
  <a class="hublink" href="https://tambakassoh.github.io/">← All courses</a>
  <h1>Macroeconomics Study Labs</h1>
  <p class="muted">Practice spaces for each lecture: animated lessons, questions that explain themselves, flashcards, self-checks and short-answer practice. Not graded. Progress saves on your own device.</p>
  <div class="lecs" id="lecs"></div>
  <p class="muted small">Based on Mankiw, <i>Principles of Macroeconomics</i>, and the course lectures.</p>
</main>
<script>
const LECTURES = [
  {n:1,  title:"GDP and the CPI", path:null},
  {n:2,  title:"Production and Growth", path:null},
  {n:3,  title:"Saving, Investment and the Financial System", path:null},
  {n:5,  title:"Unemployment", path:null},
  {n:6,  title:"The Monetary System", path:"lectures/06-monetary-system/index.html", key:"money-lab-v3", lessons:8},
  {n:7,  title:"Money Growth and Inflation", path:"lectures/07-money-growth-inflation/index.html", key:"macro-l7-inflation", lessons:9},
  {n:8,  title:"Open-Economy Macroeconomics: Basic Concepts", path:"lectures/08-open-economy-basics/index.html", key:"macro-l8-open-economy", lessons:8},
  {n:9,  title:"A Macroeconomic Theory of the Open Economy", path:"lectures/09-open-economy-theory/index.html", key:"macro-l9-open-economy-theory", lessons:8},
  {n:10, title:"Aggregate Demand and Aggregate Supply", path:"lectures/10-ad-as/index.html", key:"macro-l10-ad-as", lessons:9},
  {n:11, title:"Monetary and Fiscal Policy and Aggregate Demand", path:"lectures/11-monetary-fiscal-policy/index.html", key:"macro-l11-policy", lessons:9}
];
const box = document.getElementById("lecs");
LECTURES.forEach(L => {
  let status = "Coming soon";
  if (L.path){
    status = "Start";
    try { const s = JSON.parse(localStorage.getItem(L.key) || "null"); if (s){ const d = Object.keys(s.done || {}).length, v = Object.keys(s.seen || {}).length; status = d ? `${d} of ${L.lessons} lessons practiced` : v ? "In progress" : "Start"; } } catch(e) {}
  }
  const el = document.createElement(L.path ? "a" : "div");
  el.className = "lec" + (L.path ? "" : " soon");
  if (L.path) el.href = L.path;
  el.innerHTML = `<span class="num" aria-hidden="true">${L.n}</span><span><b>Lecture ${L.n}: ${L.title}</b><small>${status}</small></span>${L.path ? '<span class="go" aria-hidden="true">Open →</span>' : ""}`;
  box.appendChild(el);
});
</script>
</body>
</html>
